name: Detection Eval

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Now a real gate. The corpus is stable enough (346 injection / 547 benign,
      # F1 0.92) that an F1 drop past the tolerance in eval.py is a regression, not
      # noise. Re-save the baseline in the same commit if a drop is intended.
      - name: Run eval (fails on F1 regression vs baseline)
        id: eval
        run: |
          python -m pif.eval --compare-baseline --json > eval_result.json
          cat eval_result.json

      - name: Run threshold sweep
        run: python -m pif.eval --sweep --json > eval_sweep.json
        continue-on-error: true

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval_result.json
            eval_sweep.json
        if: always()
